# =============================================================================
# Pre-commit hooks TechFOREST
# Installation :
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files   # premiere passe complete
# =============================================================================

repos:
  # ----- Detection de secrets (priorite #1) -----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ----- Hygiene generale des fichiers -----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ----- Python : ruff (lint + format) -----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^Backend/
      - id: ruff-format
        files: ^Backend/
