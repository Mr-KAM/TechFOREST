services:
  db:
    image: postgis/postgis:16-3.4
    container_name: techforest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: techforest
      POSTGRES_PASSWORD: techforest
      POSTGRES_DB: techforest_db
    ports:
      - "5432:5432"
    volumes:
      - techforest_db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techforest -d techforest_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend FastAPI + Frontend React (Vite) ─────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techforest-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://techforest:techforest@db:5432/techforest_db
      DIRECT_URL: postgresql://techforest:techforest@db:5432/techforest_db
    # Variables Kobo / GEE / JWT chargees depuis Backend/.env
    # (creer Backend/.env a partir de Backend/.env.example)
    env_file:
      - Backend/.env
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      # Credentials GEE montes en lecture seule (pas embarques dans l'image)
      - ./Backend/service-account-key-gee-true.json:/app/service-account-key-gee-true.json:ro

volumes:
  techforest_db_data:
